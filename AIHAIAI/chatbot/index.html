<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KPRIT — AI Assistant</title>
  <meta name="description" content="KPRIT real-time AI assistant powered by Google Gemini with fast streaming." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg-deep: #0a0c12;
      --bg-surface: #111520;
      --bg-card: #161b2e;
      --bg-input: #1a2035;
      --accent: #6c8eff;
      --accent-glow: #6c8eff44;
      --accent-2: #a78bfa;
      --text-primary: #e8ecf4;
      --text-muted: #7a85a3;
      --user-bubble: linear-gradient(135deg, #6c8eff 0%, #a78bfa 100%);
      --bot-bubble: #1a2035;
      --border: #ffffff0f;
      --radius-lg: 18px;
      --radius-sm: 10px;
      --shadow: 0 8px 32px #00000066;
    }

    html,
    body {
      height: 100%;
    }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg-deep);
      color: var(--text-primary);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 16px;
    }

    /* ── Ambient glow ── */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 80% 60% at 20% 0%, #6c8eff18 0%, transparent 60%),
        radial-gradient(ellipse 60% 40% at 80% 100%, #a78bfa14 0%, transparent 50%);
      pointer-events: none;
      z-index: 0;
    }

    /* ── App shell ── */
    #app {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 780px;
      height: 90vh;
      max-height: 860px;
      display: flex;
      flex-direction: column;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow), 0 0 0 1px #ffffff06;
      overflow: hidden;
    }

    /* ── Header ── */
    header {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 18px 24px;
      border-bottom: 1px solid var(--border);
      background: #ffffff04;
      flex-shrink: 0;
    }

    .logo-wrap {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      background: var(--user-bubble);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      box-shadow: 0 4px 16px var(--accent-glow);
      flex-shrink: 0;
    }

    .header-text h1 {
      font-size: 16px;
      font-weight: 600;
      letter-spacing: -0.3px;
    }

    .header-text p {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #34d399;
      margin-left: auto;
      box-shadow: 0 0 8px #34d39988;
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {

      0%,
      100% {
        box-shadow: 0 0 6px #34d39988;
      }

      50% {
        box-shadow: 0 0 14px #34d399cc;
      }
    }

    .status-dot.streaming {
      background: #fbbf24;
      box-shadow: 0 0 10px #fbbf2488;
      animation: none;
    }

    /* ── Messages area ── */
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      scroll-behavior: smooth;
    }

    #messages::-webkit-scrollbar {
      width: 5px;
    }

    #messages::-webkit-scrollbar-track {
      background: transparent;
    }

    #messages::-webkit-scrollbar-thumb {
      background: #ffffff15;
      border-radius: 4px;
    }

    /* ── Empty state ── */
    #empty-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      color: var(--text-muted);
      font-size: 14px;
      text-align: center;
      padding: 40px;
    }

    #empty-state .icon {
      font-size: 48px;
      opacity: 0.5;
    }

    #empty-state strong {
      color: var(--text-primary);
      font-size: 16px;
      font-weight: 500;
    }

    .sample-prompts {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      margin-top: 14px;
      max-width: 480px;
    }

    .sample-chip {
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text-primary);
      padding: 8px 14px;
      border-radius: 20px;
      font-size: 12.5px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .sample-chip:hover {
      background: #ffffff14;
      border-color: var(--accent);
      color: #fff;
      transform: translateY(-1px);
    }

    /* ── Message rows ── */
    .msg-row {
      display: flex;
      gap: 10px;
      align-items: flex-end;
      animation: fadeUp 0.25s ease both;
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(8px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .msg-row.user {
      flex-direction: row-reverse;
    }

    .avatar {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      flex-shrink: 0;
      margin-bottom: 2px;
    }

    .avatar.bot {
      background: var(--bg-card);
      border: 1px solid var(--border);
    }

    .avatar.user {
      background: var(--user-bubble);
    }

    .bubble {
      max-width: 72%;
      padding: 12px 16px;
      border-radius: 18px;
      font-size: 14.5px;
      line-height: 1.65;
      word-break: break-word;
      white-space: pre-wrap;
    }

    .msg-row.user .bubble {
      background: var(--user-bubble);
      border-bottom-right-radius: 4px;
      color: #fff;
    }

    .msg-row.bot .bubble {
      background: var(--bot-bubble);
      border: 1px solid var(--border);
      border-bottom-left-radius: 4px;
      color: var(--text-primary);
    }

    /* ── Streaming cursor ── */
    .cursor {
      display: inline-block;
      width: 2px;
      height: 1em;
      background: var(--accent);
      vertical-align: text-bottom;
      margin-left: 2px;
      animation: blink 0.85s step-end infinite;
    }

    @keyframes blink {

      0%,
      100% {
        opacity: 1
      }

      50% {
        opacity: 0
      }
    }

    /* ── Thinking dots ── */
    .typing-dots span {
      display: inline-block;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--text-muted);
      margin: 0 2px;
      animation: dot 1.2s ease-in-out infinite;
    }

    .typing-dots span:nth-child(2) {
      animation-delay: 0.2s;
    }

    .typing-dots span:nth-child(3) {
      animation-delay: 0.4s;
    }

    @keyframes dot {

      0%,
      80%,
      100% {
        transform: scale(0.7);
        opacity: 0.4
      }

      40% {
        transform: scale(1);
        opacity: 1
      }
    }

    /* ── Input area ── */
    #input-area {
      padding: 16px 20px;
      border-top: 1px solid var(--border);
      background: #ffffff03;
      flex-shrink: 0;
    }

    #input-wrap {
      display: flex;
      align-items: flex-end;
      gap: 10px;
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 10px 12px 10px 18px;
      transition: border-color 0.2s;
    }

    #input-wrap:focus-within {
      border-color: #6c8eff55;
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    #user-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text-primary);
      font-family: inherit;
      font-size: 14.5px;
      line-height: 1.5;
      resize: none;
      max-height: 140px;
      overflow-y: auto;
      placeholder-color: var(--text-muted);
    }

    #user-input::placeholder {
      color: var(--text-muted);
    }

    #user-input::-webkit-scrollbar {
      width: 4px;
    }

    #user-input::-webkit-scrollbar-thumb {
      background: #ffffff18;
      border-radius: 3px;
    }

    #send-btn {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      border: none;
      background: var(--user-bubble);
      color: #fff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: opacity 0.2s, transform 0.15s;
      box-shadow: 0 2px 10px var(--accent-glow);
    }

    #send-btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
      transform: none;
    }

    #send-btn:not(:disabled):hover {
      transform: scale(1.07);
    }

    #send-btn:not(:disabled):active {
      transform: scale(0.96);
    }

    #send-btn svg {
      width: 18px;
      height: 18px;
    }

    /* ── Footer hint ── */
    .input-hint {
      font-size: 11px;
      color: var(--text-muted);
      text-align: center;
      margin-top: 10px;
      opacity: 0.7;
    }

    /* ── Error toast ── */
    #toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: #ff4d6d;
      color: #fff;
      padding: 10px 20px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 500;
      box-shadow: 0 4px 20px #ff4d6d55;
      display: none;
      z-index: 999;
    }

    @media (max-width: 600px) {
      #app {
        height: 100dvh;
        max-height: none;
        border-radius: 0;
        border: none;
      }

      body {
        padding: 0;
      }
    }
  </style>
</head>

<body>

  <div id="app">
    <header>
      <div class="logo-wrap">🎓</div>
      <div class="header-text">
        <h1>KPRIT AI Assistant</h1>
        <p>KPRIT Smart Assistant · Real-time streaming</p>
      </div>
      <span class="status-dot" id="status-dot" title="Online"></span>
    </header>

    <div id="messages">
      <div id="empty-state">
        <div class="icon">🎓</div>
        <strong>Welcome to KPRIT AI</strong>
        <p>Ask me anything — I'm here to assist you in real time.</p>
        <div class="sample-prompts">
          <button class="sample-chip" onclick="useSample(this)">Explain quantum computing simply</button>
          <button class="sample-chip" onclick="useSample(this)">Write a Python function to check for palindromes</button>
          <button class="sample-chip" onclick="useSample(this)">3 productivity tips for engineering students</button>
          <button class="sample-chip" onclick="useSample(this)">Tell me an amazing fact about technology</button>
        </div>
      </div>
    </div>

    <div id="input-area">
      <div id="input-wrap">
        <textarea id="user-input" rows="1" placeholder="Type a message… (Enter to send, Shift+Enter for newline)"
          autocomplete="off" spellcheck="true"></textarea>
        <button id="send-btn" title="Send message">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"
            stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13" />
            <polygon points="22 2 15 22 11 13 2 9 22 2" />
          </svg>
        </button>
      </div>
      <p class="input-hint">Session is in-memory only · history resets on page refresh</p>
    </div>
  </div>

  <div id="toast"></div>

  <script>
    // ── State ────────────────────────────────────────────────────────────────
    let sessionId = null;
    let isStreaming = false;

    const $messages = document.getElementById('messages');
    const $emptyState = document.getElementById('empty-state');
    const $input = document.getElementById('user-input');
    const $sendBtn = document.getElementById('send-btn');
    const $statusDot = document.getElementById('status-dot');
    const $toast = document.getElementById('toast');

    // ── Init: create session on load ─────────────────────────────────────────
    async function initSession() {
      try {
        const res = await fetch('/session', { method: 'POST' });
        if (!res.ok) throw new Error('Failed to create session');
        const data = await res.json();
        sessionId = data.session_id;
      } catch (err) {
        showToast('Could not connect to server. Is the backend running?');
      }
    }

    // ── Auto-resize textarea ─────────────────────────────────────────────────
    $input.addEventListener('input', () => {
      $input.style.height = 'auto';
      $input.style.height = Math.min($input.scrollHeight, 140) + 'px';
    });

    // ── Enter to send ────────────────────────────────────────────────────────
    $input.addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    $sendBtn.addEventListener('click', sendMessage);

    // ── Send message ─────────────────────────────────────────────────────────
    async function sendMessage() {
      const text = $input.value.trim();
      if (!text || isStreaming || !sessionId) return;

      isStreaming = true;
      $sendBtn.disabled = true;
      $statusDot.classList.add('streaming');
      $statusDot.title = 'Streaming…';

      // Hide empty state
      if ($emptyState) $emptyState.remove();

      // Append user bubble
      appendBubble('user', text);

      // Reset textarea
      $input.value = '';
      $input.style.height = 'auto';

      // Show typing indicator
      const typingRow = appendTypingIndicator();

      let botBubble = null;
      let fullText = '';

      try {
        const response = await fetch('/chat/stream', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ session_id: sessionId, message: text }),
        });

        if (!response.ok) {
          const err = await response.json();
          throw new Error(err.detail || 'Request failed');
        }

        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let buffer = '';

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;

          buffer += decoder.decode(value, { stream: true });
          const lines = buffer.split('\n\n');
          buffer = lines.pop(); // keep incomplete chunk

          for (const line of lines) {
            if (!line.startsWith('data: ')) continue;
            let payload;
            try { payload = JSON.parse(line.slice(6)); }
            catch { continue; }

            if (payload.error) {
              if (typingRow && typingRow.parentNode) typingRow.remove();
              showToast('Error: ' + payload.error);
              break;
            }

            if (!payload.done && payload.token) {
              // Remove typing indicator on first token
              if (typingRow && typingRow.parentNode) typingRow.remove();

              // Create bot bubble on first token
              if (!botBubble) {
                botBubble = createBotBubble();
              }

              fullText += payload.token;
              updateBotBubble(botBubble, fullText, false);
            }

            if (payload.done) {
              if (botBubble) updateBotBubble(botBubble, fullText, true);
            }
          }
        }
      } catch (err) {
        if (typingRow && typingRow.parentNode) typingRow.remove();
        showToast(err.message || 'Something went wrong.');
      } finally {
        isStreaming = false;
        $sendBtn.disabled = false;
        $statusDot.classList.remove('streaming');
        $statusDot.title = 'Online';
        $input.focus();
      }
    }

    // ── DOM helpers ───────────────────────────────────────────────────────────

    function appendBubble(role, text) {
      const row = document.createElement('div');
      row.className = `msg-row ${role}`;

      const avatar = document.createElement('div');
      avatar.className = `avatar ${role === 'user' ? 'user' : 'bot'}`;
      avatar.textContent = role === 'user' ? '🧑' : '🤖';

      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      bubble.textContent = text;

      row.appendChild(avatar);
      row.appendChild(bubble);
      $messages.appendChild(row);
      scrollBottom();
      return row;
    }

    function appendTypingIndicator() {
      const row = document.createElement('div');
      row.className = 'msg-row bot';

      const avatar = document.createElement('div');
      avatar.className = 'avatar bot';
      avatar.textContent = '🤖';

      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      bubble.innerHTML = '<div class="typing-dots"><span></span><span></span><span></span></div>';

      row.appendChild(avatar);
      row.appendChild(bubble);
      $messages.appendChild(row);
      scrollBottom();
      return row;
    }

    function createBotBubble() {
      const row = document.createElement('div');
      row.className = 'msg-row bot';

      const avatar = document.createElement('div');
      avatar.className = 'avatar bot';
      avatar.textContent = '🤖';

      const bubble = document.createElement('div');
      bubble.className = 'bubble';

      row.appendChild(avatar);
      row.appendChild(bubble);
      $messages.appendChild(row);
      return bubble;
    }

    function updateBotBubble(bubble, text, isDone) {
      if (isDone) {
        bubble.textContent = text;
      } else {
        bubble.innerHTML =
          escapeHtml(text) + '<span class="cursor"></span>';
      }
      scrollBottom();
    }

    function escapeHtml(str) {
      return str
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;')
        .replace(/\n/g, '<br>');
    }

    function scrollBottom() {
      $messages.scrollTo({ top: $messages.scrollHeight, behavior: 'smooth' });
    }

    // ── Toast ─────────────────────────────────────────────────────────────────
    function showToast(msg, duration = 4000) {
      $toast.textContent = msg;
      $toast.style.display = 'block';
      clearTimeout(showToast._t);
      showToast._t = setTimeout(() => { $toast.style.display = 'none'; }, duration);
    }

    // ── Cleanup on tab close ──────────────────────────────────────────────────
    window.addEventListener('beforeunload', () => {
      if (sessionId) {
        navigator.sendBeacon(`/session/${sessionId}`, new Blob(
          [JSON.stringify({ _method: 'DELETE' })],
          { type: 'application/json' }
        ));
      }
    });

    function useSample(btn) {
      if (isStreaming) return;
      $input.value = btn.textContent.trim();
      sendMessage();
    }

    // ── Boot ──────────────────────────────────────────────────────────────────
    initSession();
    $input.focus();
  </script>
</body>

</html>
